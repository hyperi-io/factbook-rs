# Project false positives, on top of the default rules: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

# A public PGP key id, which the generic-api-key rule reads as high entropy.
[[allowlists]]
description = "Confluent APT signing-key fingerprint (public key id, not a credential)"
regexes = ['''CBBB821E8FAF364F79835C438B1DA6120C2BF624''']
