# Project:   factbook
# File:      Cargo.toml
# Purpose:   IP enrichment: provision the databases, then look them up fast
# Language:  TOML
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "factbook"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A high-speed, self-maintaining fact enricher for data at scale. Point it at reference data and it fetches, verifies, indexes and serves it, keeping itself current. IP geolocation is the batteries-included case."
license = "Apache-2.0"
repository = "https://github.com/hyperi-io/factbook-rs"
documentation = "https://docs.rs/factbook"
# The crates.io page. README.md stays the GitHub front page.
readme = "docs/crate.md"
publish = true
keywords = ["geoip", "mmdb", "maxmind", "enrichment", "reference-data"]
categories = ["network-programming", "caching", "database"]
# Leading slashes anchor to the package root, so `/README.md` misses `docs/README.md`.
include = [
    "/src/**",
    # The bench opens the fixtures, so it ships with them or panics.
    "/benches/**",
    "/tests/data/**",
    "/README.md",
    "/docs/crate.md",
    "/LICENSE",
    "/NOTICE",
    "/SOURCES.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# What each feature pulls in, and why the absent ones are absent: docs/architecture.md.
default = ["geoip", "metrics"]

geoip = ["geoip-download", "geoip-lookup"]

geoip-download = [
    "dep:reqwest",
    "dep:tokio",
    "dep:flate2",
    "dep:tar",
    "dep:chrono",
    "dep:serde_json",
    "dep:sha2",
    "dep:prefix-trie",
    "dep:ipnet",
]

geoip-lookup = [
    "dep:maxminddb",
    "dep:quick_cache",
    "dep:compact_str",
    "dep:arc-swap",
]

metrics = ["dep:metrics"]

metrics-lookup = ["metrics", "geoip-lookup"]

# Criterion supplies its own main, so the libtest harness is off.
[[bench]]
name = "geoip_lookup"
harness = false
required-features = ["geoip-lookup"]

[[bench]]
name = "table_lookup"
harness = false
required-features = ["geoip-download"]

[dependencies]
serde = { version = ">=1.0.229, <2", features = ["derive"] }
thiserror = ">=2.0.21, <3"
tracing = ">=0.1.44, <0.2"

# --- geoip-download ---
# rustls rather than native-tls, and `query` keeps the IPinfo token out of the logged URL.
reqwest = { version = ">=0.13.5, <0.14", default-features = false, features = ["json", "rustls", "query"], optional = true }
tokio = { version = ">=1.54.1, <2", features = ["rt", "fs", "time"], optional = true }
flate2 = { version = ">=1.1.10, <2", optional = true }
tar = { version = ">=0.4.46, <0.5", optional = true }
chrono = { version = ">=0.4.45, <0.5", optional = true }
serde_json = { version = ">=1.0.154, <2", optional = true }
sha2 = { version = ">=0.11.1, <0.12", optional = true }

# Longest-prefix match for an `index: prefix` table.
prefix-trie = { version = ">=0.10.1, <0.11", default-features = false, features = ["ipnet"], optional = true }
ipnet = { version = ">=2.12.2, <3", default-features = false, optional = true }
# --- geoip-lookup ---
# 0.31 and later bound what a crafted database can expand to: SECURITY.md.
maxminddb = { version = ">=0.32.0, <0.33", features = ["mmap"], optional = true }
# Never name this crate in a public signature: it is 0.x, so its bumps would break consumers.
quick_cache = { version = ">=0.7.0, <0.8", optional = true }
compact_str = { version = ">=0.10.0, <0.11", features = ["serde"], optional = true }
arc-swap = { version = ">=1.9.3, <2", optional = true }

# --- metrics ---
metrics = { version = ">=0.24.6, <0.25", optional = true }

[dev-dependencies]
tokio = { version = ">=1.54.1, <2", features = ["full", "test-util"] }
tempfile = ">=3.27.0, <4"
serde_json = ">=1.0.154, <2"
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
pretty_assertions = ">=1.4.1, <2"
# Serves the provider URLs over loopback for the download tests.
wiremock = ">=0.6.5, <0.7"
# Must match the optional dependency exactly: two reqwest builds is E0464 on the lib tests.
reqwest = { version = ">=0.13.5, <0.14", default-features = false, features = ["json", "rustls", "query"] }

# Dependency debug info is off: it dominates compiler memory and target-dir space.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Its suggestions are Rust 1.99 APIs, above the MSRV.
duration_suboptimal_units = "allow"

# Test and bench code does not inherit lib.rs attributes.
doc_markdown = "allow"
unnecessary_debug_formatting = "allow"
redundant_closure_for_method_calls = "allow"
items_after_statements = "allow"
unwrap_used = "allow"
