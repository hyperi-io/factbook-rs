#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

# Category 4, general OSS.
classification: oss

language: rust
license: Apache-2.0
quality:
  enabled: true
  rust:
    # Blocking, because this crate publishes publicly.
    deny: blocking
    audit: blocking
test:
  enabled: true
  coverage: false
  rust:
    nextest: true
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets: []
release:
  enabled: true
